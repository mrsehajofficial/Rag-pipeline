version: "3.9"

# ---------------------------------------------------------------------------
# ragpipe docker-compose
#
# Quick start:
#   cp .env.example .env        # fill in your secrets
#   docker compose up -d
#   docker compose exec ragpipe rag ingest /data/docs
#
# Volumes:
#   ./data  ->  /data   (persisted index, caches, traces)
#   ./data/docs -> /data/docs  (your source documents)
# ---------------------------------------------------------------------------

services:
  ragpipe:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ragpipe:latest
    container_name: ragpipe

    restart: unless-stopped

    ports:
      - "${RAG_PORT:-8000}:8000"

    volumes:
      # Persist the vector index, embedding cache, and LLM cache across restarts
      - ./data:/data

    environment:
      # ---- Security ---------------------------------------------------------
      # REQUIRED for any non-loopback deployment: set a strong random secret.
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      RAG_API_KEY: "${RAG_API_KEY:-}"

      # Only allow /ingest to read from the mounted docs directory
      RAG_INGEST_ROOT: /data

      # ---- Embedding --------------------------------------------------------
      # Options: hashing (offline, dev), local (ONNX, no key), openai (production)
      RAG_EMBED_PROVIDER: "${RAG_EMBED_PROVIDER:-hashing}"
      RAG_EMBED_MODEL: "${RAG_EMBED_MODEL:-text-embedding-3-small}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"

      # ---- Generation -------------------------------------------------------
      RAG_LLM_PROVIDER: "${RAG_LLM_PROVIDER:-extractive}"
      RAG_LLM_MODEL: "${RAG_LLM_MODEL:-gpt-4o-mini}"

      # ---- Observability ----------------------------------------------------
      RAG_LOG_JSON: "true"
      RAG_LOG_LEVEL: "${RAG_LOG_LEVEL:-INFO}"

      # ---- Tuning -----------------------------------------------------------
      RAG_TOP_K: "${RAG_TOP_K:-8}"
      RAG_RERANK: "${RAG_RERANK:-true}"
      RAG_MAX_QUERY_CHARS: "${RAG_MAX_QUERY_CHARS:-2000}"
      RAG_RATE_LIMIT_RPS: "${RAG_RATE_LIMIT_RPS:-10}"

      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
